name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Публикуем только сайт и игру, без README и служебных файлов
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r play img assets _site/
          # проверка: без этих файлов сайт сломан — лучше упасть здесь, чем опубликовать пустоту
          test -f _site/play/index.html
          test -f _site/assets/logo.webp

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
